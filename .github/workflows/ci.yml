name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
# A called workflow sees the caller's github.workflow, so the release run of CI never shares a group with the release itself.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# The jobs that save caches do so only on a push to main. Every other job restores the main caches.
jobs:
  lint-test-build:
    name: Lint, test, build (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          save-cache: true
      - name: Run mise run ci
        run: mise run ci
      - name: Save the Go cache
        uses: ./.github/actions/save-go-cache
        with:
          paths: ${{ steps.setup.outputs.go-cache-paths }}
          key: ${{ steps.setup.outputs.go-cache-key }}
          hit: ${{ steps.setup.outputs.go-cache-hit }}

  # Hosted arm64 runners have no KVM, so the VM and Kubernetes tests run only on x64.
  test-linux-arm64:
    name: Test (Linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          save-cache: true
      - name: Vendor the Go modules
        run: mise run deps
      - name: Run the unit tests and host-only checks
        run: mise run test
      - name: Check that the vm and kube tests skip without KVM and fail with SBXR_TEST_REQUIRE=1
        run: scripts/ci/check-require.sh
      - name: Save the Go cache
        uses: ./.github/actions/save-go-cache
        with:
          paths: ${{ steps.setup.outputs.go-cache-paths }}
          key: ${{ steps.setup.outputs.go-cache-key }}
          hit: ${{ steps.setup.outputs.go-cache-hit }}

  # This job also covers the help timing test on a terminal that never answers color queries.
  test-macos:
    name: Test (macOS)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          save-cache: true
      - name: Vendor the Go modules
        run: mise run deps
      - name: Run the unit tests and host-only checks
        run: mise run test
      - name: Build and sign bin/sbxr
        run: mise run build
      # Hosted macOS runners have no hypervisor, so doctor must report it while the signature is in place.
      - name: Check the signature and sbxr doctor
        run: scripts/ci/check-signature.sh bin/sbxr
      - name: Save the Go cache
        uses: ./.github/actions/save-go-cache
        with:
          paths: ${{ steps.setup.outputs.go-cache-paths }}
          key: ${{ steps.setup.outputs.go-cache-key }}
          hit: ${{ steps.setup.outputs.go-cache-hit }}

  vm:
    name: VM tests (Linux KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      - name: Enable KVM
        run: scripts/ci/enable-kvm.sh
      - name: Enable subordinate ids
        run: scripts/ci/enable-subids.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # This job tests the libkrun of the node image, not the Homebrew libkrun that CLI users install.
      # On main, the Kubernetes job fills the layer cache, and this job only reads it.
      - name: Build libkrun and libkrunfw
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/node/Dockerfile
          target: libkrun
          outputs: type=local,dest=krun
          provenance: false
          sbom: false
          cache-from: type=gha,scope=node-${{ runner.arch }}
      - name: Vendor the Go modules
        run: mise run deps
      - name: Build bin/sbxr
        run: mise run build
      - name: Install sbxr and the AppArmor profile
        run: scripts/ci/install-sbxr.sh bin/sbxr
      - name: Run the VM tests
        timeout-minutes: 20
        env:
          CGO_ENABLED: "0"
          SBXR_TEST_REQUIRE: "1"
          SBXR_BIN: /usr/local/bin/sbxr
          SBXR_LIB_DIR: ${{ github.workspace }}/krun/lib
        run: mise run test:vm -v

  kube:
    name: Kubernetes tests (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      - name: Enable KVM
        run: scripts/ci/enable-kvm.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The layer cache keeps the node bundle until a version argument in the Dockerfile changes.
      # Only a push to main writes the layer cache. An empty cache-to skips the export.
      - name: Build the installer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/node/Dockerfile
          load: true
          tags: sbxr-node:ci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=node-${{ runner.arch }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope=node-{0}', runner.arch) || '' }}
      - name: Vendor the Go modules
        run: mise run deps
      - name: Run the Kubernetes tests
        timeout-minutes: 10
        env:
          SBXR_TEST_REQUIRE: "1"
          SBXR_NODE_IMAGE: sbxr-node:ci
        run: mise run test:kube -v
      - name: Collect kind diagnostics
        if: failure()
        run: scripts/ci/kind-diagnostics.sh kind-logs
      - name: Upload the kind logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs
          path: kind-logs
          retention-days: 7

  # The install jobs install a goreleaser snapshot the way a user installs a release. Like every job, they restore the main mise and Go caches.
  install-linux:
    name: Install (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      - name: Build a goreleaser snapshot
        run: goreleaser release --snapshot --clean
      - name: Run the README setup block
        run: scripts/ci/readme-setup.sh
      # A new login picks up the kvm group, like the last line of the block asks.
      - name: Run sbxr doctor in a new login
        run: sudo -iu "$USER" sbxr doctor

  install-macos:
    name: Install (macOS Homebrew)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      - name: Build a goreleaser snapshot
        run: goreleaser release --snapshot --clean
      # The runner image predates libkrun in homebrew/core (added 2026-11-05).
      - name: Update Homebrew
        run: brew update
      - name: Show the Homebrew version
        run: brew --version
      # The fully qualified name taps and trusts the formula without a brew tap or brew trust step.
      - name: Install the formula dependencies
        run: brew install --only-dependencies albertsko/tap/sbxr
      - name: Point the formula at the snapshot archive
        run: scripts/ci/point-formula-at-snapshot.sh
      - name: Install sbxr
        run: brew install albertsko/tap/sbxr
      - name: Run brew test
        run: brew test albertsko/tap/sbxr
      - name: Check the trust and sbxr doctor
        run: scripts/ci/check-brew-install.sh

  # The one check to require: it fails when any other job failed, was cancelled, or was skipped.
  result:
    name: CI result
    if: always()
    needs: [lint-test-build, test-linux-arm64, test-macos, vm, kube, install-linux, install-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # always() replaces the implicit success(), which is false after a failed or cancelled needed job and would skip this step.
      - name: Fail when a needed job failed, was cancelled, or was skipped
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped'))
        run: exit 1
