name: HV
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hv-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  LIBKRUN_VERSION: v1.19.8
  LIBKRUNFW_VERSION: v5.6.4
jobs:
  libkrun:
    name: libkrun
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - id: key
        run: echo "key=krun-${RUNNER_OS}-${RUNNER_ARCH}-libkrun-${LIBKRUN_VERSION}-net-libkrunfw-${LIBKRUNFW_VERSION}" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: krun
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libclang-dev
          git clone -q --depth 1 --branch "$LIBKRUN_VERSION" https://github.com/libkrun/libkrun /tmp/libkrun
          make -C /tmp/libkrun NET=1 -j"$(nproc)"
          make -C /tmp/libkrun NET=1 install PREFIX="$PWD/krun" LIBDIR_Linux=lib
          mkdir /tmp/krunfw
          curl -fsSL "https://github.com/libkrun/libkrunfw/releases/download/${LIBKRUNFW_VERSION}/libkrunfw-x86_64.tgz" | tar -xz -C /tmp/krunfw
          cp -a /tmp/krunfw/lib/*/libkrunfw.so* krun/lib/
          ls -l krun/lib
  hv:
    name: hv
    needs: libkrun
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        id: mise
        with:
          minimum_release_age: 7d
          cache_save: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.go }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.go }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: krun
          key: ${{ needs.libkrun.outputs.key }}
          fail-on-cache-miss: true
      - name: Enable KVM, uidmap, and subordinate ids
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y -q uidmap
          grep -q "^$USER:" /etc/subuid || sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"
      - run: mise run deps
      # The runner restricts user namespaces with AppArmor, so sbxr runs from the profile path.
      - name: Install sbxr and the AppArmor profile
        shell: bash
        run: |
          mise run build
          sudo install -m 755 bin/sbxr /usr/local/bin/sbxr
          sbxr doctor apparmor-profile | sudo tee /etc/apparmor.d/sbxr
          sudo apparmor_parser -r /etc/apparmor.d/sbxr
      - name: test:hv
        timeout-minutes: 10
        env:
          CGO_ENABLED: "0"
          SBXR_REQUIRE_HV: "1"
          SBXR_BIN: /usr/local/bin/sbxr
        run: SBXR_LIB_DIR="$PWD/krun/lib" mise run test:hv -- -v
