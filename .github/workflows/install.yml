name: Install
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: install-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Both jobs install a goreleaser snapshot the way a user installs a release, from a fresh runner.
jobs:
  linux:
    name: install-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          minimum_release_age: 7d
          cache: false
          install_args: go github:goreleaser/goreleaser
      - run: goreleaser release --snapshot --clean
      # The README block runs unchanged, except that it downloads the snapshot archive.
      - name: Run the README setup block
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          awk '/^### Linux/ { s = 1 } s && /^```sh$/ { f = 1; next } f && /^```$/ { exit } f' README.md |
            sed "s|https://github.com/albertsko/sbxr/releases/latest/download/|file://$PWD/dist/|" >setup.sh
          cat setup.sh
          bash -euxo pipefail setup.sh
      # A new login picks up the kvm group, like the last line of the block asks.
      - run: sudo -iu "$USER" sbxr doctor
  macos:
    name: install-macos
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          minimum_release_age: 7d
          cache: false
          install_args: go github:goreleaser/goreleaser
      - run: goreleaser release --snapshot --clean
      # The runner image predates libkrun in homebrew/core (added 2026-11-05).
      - run: brew update
      - run: brew --version
      # The fully qualified name taps and trusts the formula without a brew tap or brew trust step.
      - run: brew install --only-dependencies albertsko/tap/sbxr
      # Later steps skip the auto-update, which would reset the edited formula.
      - name: Point the formula at the snapshot archive
        shell: bash
        run: |
          formula="$(brew --repo albertsko/tap)/Formula/sbxr.rb"
          sha="$(shasum -a 256 dist/sbxr_darwin_arm64.tar.gz | cut -d ' ' -f 1)"
          sed -i '' -e "s|^  url \".*\"|  url \"file://$PWD/dist/sbxr_darwin_arm64.tar.gz\"|" -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" "$formula"
          echo HOMEBREW_NO_AUTO_UPDATE=1 >>"$GITHUB_ENV"
      - run: brew install albertsko/tap/sbxr
      - run: brew trust
      # Hosted macOS runners have no hypervisor, so every other check must pass.
      - name: sbxr doctor fails only the hypervisor check
        run: |
          sbxr doctor || true
          if sbxr doctor --json >doctor.json; then exit 1; fi
          jq -e '[.checks[] | select(.status == "fail") | .id] == ["hypervisor"]' doctor.json
