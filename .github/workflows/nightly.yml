name: Nightly
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true
# The checks that are too slow or too random for every pull request: shuffled tests without the test cache, shuffled VM tests, and a long fuzz run.
jobs:
  shuffle:
    name: Shuffled tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            runner: ubuntu-latest
          - platform: Linux arm64
            runner: ubuntu-24.04-arm
          - platform: macOS
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      - name: Vendor the Go modules
        run: mise run deps
      - name: Run the tests in random order
        run: mise run test:shuffle

  # The setup follows the vm job of ci.yml.
  vm-shuffle:
    name: Shuffled VM tests (Linux KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      - name: Enable KVM
        run: scripts/ci/enable-kvm.sh
      - name: Enable subordinate ids
        run: scripts/ci/enable-subids.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build libkrun and libkrunfw
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/node/Dockerfile
          target: libkrun
          outputs: type=local,dest=krun
          provenance: false
          sbom: false
          cache-from: type=gha,scope=node-${{ runner.arch }}
      - name: Vendor the Go modules
        run: mise run deps
      - name: Build bin/sbxr
        run: mise run build
      - name: Install sbxr and the AppArmor profile
        run: scripts/ci/install-sbxr.sh bin/sbxr
      - name: Run the VM tests in random order
        timeout-minutes: 20
        env:
          CGO_ENABLED: "0"
          SBXR_TEST_REQUIRE: "1"
          SBXR_BIN: /usr/local/bin/sbxr
          SBXR_LIB_DIR: ${{ github.workspace }}/krun/lib
        run: mise run test:vm -v -shuffle=on

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      - name: Fuzz for 15 minutes
        run: mise run fuzz 15m
      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: internal/krunconfig/testdata/fuzz
          if-no-files-found: ignore
