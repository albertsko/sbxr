name: Kind
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kind-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  kind:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kind
            phase: "1"
            upgrade-from: ""
          # Phase 2 starts from phase 1, so the phase 1 criteria run after the node upgrade.
          - name: kind-p2
            phase: "2"
            upgrade-from: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        id: mise
        with:
          minimum_release_age: 7d
          cache_save: false
          install_args: go aqua:kubernetes-sigs/kind aqua:kubernetes/kubectl
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.go }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.go }}-
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The layer cache keeps the node bundle until a version argument in the Dockerfile changes.
      - name: Build the installer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/node/Dockerfile
          load: true
          tags: sbxr-node:ci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=node-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=node-${{ runner.arch }}
      - run: go mod vendor
      - name: Test
        timeout-minutes: 10
        env:
          SBXR_REQUIRE_HV: "1"
          SBXR_NODE_IMAGE: sbxr-node:ci
          SBXR_PHASE: ${{ matrix.phase }}
          SBXR_UPGRADE_FROM: ${{ matrix.upgrade-from }}
        run: mise run test:kind -v
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get node -o yaml | grep -E 'sbxr|runtimeHandlers' -A2 || true
          kubectl get pods -A -o wide || true
          kubectl -n sbxr-system logs ds/sbxr-node || true
          kubectl -n sbxr-test describe pods || true
          docker exec sbxr-control-plane sh -c 'tail -n 30 /run/sbxr/pods/*/vm.log' || true
          kind export logs --name sbxr kind-logs || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-logs
          path: kind-logs
          retention-days: 7
