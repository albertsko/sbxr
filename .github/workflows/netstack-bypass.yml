name: netstack-bypass-spike
on:
  push:
    branches: [spike/netstack-bypass]
permissions:
  contents: read
env:
  LIBKRUN_VERSION: v1.19.8
  LIBKRUNFW_VERSION: v5.6.4
  ALPINE_VERSION: 3.24.4
jobs:
  gvnet:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@v5
        with:
          go-version-file: spike/gvnet/go.mod
          cache-dependency-path: spike/gvnet/go.sum

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          uname -a; nproc; free -m

      - name: Cache libkrun
        id: cache
        uses: actions/cache@v4
        with:
          path: krun
          key: gvnet-krun-v1-${{ env.LIBKRUN_VERSION }}-net-${{ env.LIBKRUNFW_VERSION }}

      - name: Build libkrun (NET=1) and fetch libkrunfw
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q libclang-dev
          mkdir -p krun/lib /tmp/fw
          curl -fsSL "https://github.com/libkrun/libkrunfw/releases/download/${LIBKRUNFW_VERSION}/libkrunfw-x86_64.tgz" | tar xz -C /tmp/fw
          cp -a /tmp/fw/lib/x86_64-linux-gnu/libkrunfw.so* krun/lib/
          git clone -q --depth 1 -b "${LIBKRUN_VERSION}" https://github.com/libkrun/libkrun /tmp/libkrun
          make -C /tmp/libkrun NET=1 -j"$(nproc)"
          make -C /tmp/libkrun install NET=1 PREFIX="$PWD/krun" LIBDIR_Linux=lib
          ls -l krun/lib

      - name: Alpine rootfs
        run: |
          set -euxo pipefail
          mkdir -p /tmp/dl rootfs
          base=https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION%.*}/releases/x86_64
          f=alpine-minirootfs-${ALPINE_VERSION}-x86_64.tar.gz
          curl -fsSL -o /tmp/dl/$f "$base/$f"
          curl -fsSL -o /tmp/dl/$f.sha256 "$base/$f.sha256"
          (cd /tmp/dl && sha256sum -c $f.sha256)
          tar -xzf /tmp/dl/$f -C rootfs

      - name: Build spike
        run: |
          sudo apt-get install -y -q lsof
          spike/gvnet/build.sh "$PWD/out"
          ls -l out
          cd spike/gvnet && echo "modules: $(go list -m all | wc -l)" && go version -m ../../out/gvnet | awk '$1=="dep"{print $2, $3}'

      - name: Bypass matrix and resource caps
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/krun/lib
          GVNET_LIB_DIR: ${{ github.workspace }}/krun/lib
        run: |
          export LAN_IP=$(hostname -I | awk '{print $1}')
          echo "LAN_IP=$LAN_IP ulimit -n soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          ip -4 -o addr
          r=spike/gvnet/run.sh
          PROBE=1 $r "$PWD/out" "$PWD/rootfs" noguard
          PROBE=1 $r "$PWD/out" "$PWD/rootfs" guard -guard
          PROBE=1 $r "$PWD/out" "$PWD/rootfs" guard-lan -guard -allow-lan
          HOLD_N=2000 $r "$PWD/out" "$PWD/rootfs" hold-noguard
          HOLD_N=2000 $r "$PWD/out" "$PWD/rootfs" hold-guard-lan -guard -allow-lan
