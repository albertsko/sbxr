name: spike-node-bundle
on:
  push:
    branches: [spike/node-bundle]
  workflow_dispatch:
permissions:
  contents: read
env:
  KIND_VERSION: v0.33.0
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build bundle
        run: |
          docker buildx build --progress plain -f deploy/bundle/Dockerfile \
            --cache-from type=gha,scope=bundle --cache-to type=gha,mode=max,scope=bundle \
            --output type=local,dest=out deploy/bundle 2>&1 | tee build.log
          grep -E '\+LIBKRUN|glibc floor|/opt/sbxr$' build.log
          du -sh out
          tar -C out -czf bundle.tgz .
          ls -l bundle.tgz
      - uses: actions/upload-artifact@v4
        with: {name: bundle-x86_64, path: bundle.tgz}

  distro:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "debian:12", "kindest/node:v1.37.0", "ubuntu:24.04", "rockylinux/rockylinux:9", "amazonlinux:2023", "debian:11"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: {name: bundle-x86_64}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke
        run: |
          mkdir out rootfs
          tar -C out -xzf bundle.tgz
          docker export "$(docker create busybox:1.37)" | tar -C rootfs -x
          docker run --rm --privileged --entrypoint bash \
            -v "$PWD/out:/opt/sbxr:ro" -v "$PWD/rootfs:/rootfs" -v "$PWD/deploy/bundle/smoke.sh:/smoke.sh:ro" \
            "${{ matrix.image }}" -c 'head -1 /etc/os-release; ldd --version | head -1; bash /smoke.sh /opt/sbxr /rootfs'

  kind:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: {name: bundle-x86_64}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
          sudo install kind /usr/local/bin/kind
      - name: Pods through containerd
        run: |
          mkdir out
          tar -C out -xzf bundle.tgz
          bash spike/node-bundle/kind-pod.sh out kindest/node:v1.37.0

  dropin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: rke2, version: v1.34.13+rke2r1}
          - {distro: rke2, version: v1.37.2+rke2r1}
          - {distro: k3s, version: v1.34.13+k3s1}
          - {distro: k3s, version: v1.37.2+k3s1}
          - {distro: k0s, version: v1.36.6+k0s.0}
          - {distro: k0s, version: v1.37.2+k0s.1}
    steps:
      - uses: actions/checkout@v5
      - run: bash spike/node-bundle/dropin.sh "${{ matrix.distro }}" "${{ matrix.version }}"

  mapolicy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["kindest/node:v1.34.11", "kindest/node:v1.35.8", "kindest/node:v1.36.4", "kindest/node:v1.37.0"]
    steps:
      - uses: actions/checkout@v5
      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
          sudo install kind /usr/local/bin/kind
      - run: bash spike/node-bundle/mapolicy.sh "${{ matrix.image }}"
