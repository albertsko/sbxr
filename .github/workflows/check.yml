name: Check
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        id: mise
        with:
          minimum_release_age: 7d
          cache_save: ${{ env.SAVE_CACHE }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-cache
        with:
          path: &go-cache-paths |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.go }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.go }}-
      - run: mise run ci
      - run: mise run fuzz 30s
      - if: env.SAVE_CACHE == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *go-cache-paths
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
  fake:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        id: mise
        with:
          minimum_release_age: 7d
          cache_save: ${{ env.SAVE_CACHE }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-cache
        with:
          path: *go-cache-paths
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.go }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.go }}-
      # The macos job also covers the help timing test on a terminal that never answers color queries.
      - run: mise run deps
      - run: mise run test
      # Hosted arm64 runners have no KVM.
      - if: matrix.name == 'linux-arm64'
        name: test:hv and test:kind skip without a hypervisor and fail with SBXR_REQUIRE_HV=1
        run: |
          mise run test:hv
          mise run test:kind
          if SBXR_REQUIRE_HV=1 mise run test:hv; then exit 1; fi
          if SBXR_REQUIRE_HV=1 mise run test:kind; then exit 1; fi
      - if: env.SAVE_CACHE == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *go-cache-paths
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
