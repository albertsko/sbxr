name: VM tests
on:
  workflow_call:
    inputs:
      shuffle:
        description: Run the tests in random order.
        type: boolean
        default: false
permissions:
  contents: read
# A called workflow sees the caller's github.workflow, so CI and Nightly runs never share a group.
concurrency:
  group: vm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  vm:
    name: VM tests (Linux KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: ./.github/actions/setup
      - name: Enable KVM
        run: scripts/ci/enable-kvm.sh
      - name: Enable subordinate ids
        run: scripts/ci/enable-subids.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # This job tests the libkrun of the node image, not the Homebrew libkrun that CLI users install.
      # On main, the Kubernetes job of ci.yml fills the layer cache, and this job only reads it.
      - name: Build libkrun and libkrunfw
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/node/Dockerfile
          target: libkrun
          outputs: type=local,dest=krun
          provenance: false
          sbom: false
          cache-from: type=gha,scope=node-${{ runner.arch }}
      - name: Vendor the Go modules
        run: mise run deps
      - name: Build bin/sbxr
        run: mise run build
      - name: Install sbxr and the AppArmor profile
        run: scripts/ci/install-sbxr.sh bin/sbxr
      # The step outlasts the go test timeout of mise run test:vm, so that go test reports a hang itself.
      - name: Run the VM tests
        timeout-minutes: 20
        env:
          CGO_ENABLED: "0"
          SBXR_TEST_REQUIRE: "1"
          SBXR_BIN: /usr/local/bin/sbxr
          SBXR_LIB_DIR: ${{ github.workspace }}/krun/lib
        run: mise run test:vm -v ${{ inputs.shuffle && '-shuffle=on' || '' }}
