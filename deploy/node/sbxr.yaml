# sbxr for Kubernetes. Docs: https://github.com/albertsko/sbxr/blob/main/docs/kubernetes.md
apiVersion: v1
kind: Namespace
metadata:
  name: sbxr-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sbxr-node
  namespace: sbxr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sbxr-node
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sbxr-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sbxr-node
subjects:
  - kind: ServiceAccount
    name: sbxr-node
    namespace: sbxr-system
---
# RBAC cannot name the caller's own node, so this policy limits each installer pod to the node it runs on.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sbxr-node-self
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [nodes]
  matchConditions:
    - name: installer
      expression: request.userInfo.username == 'system:serviceaccount:sbxr-system:sbxr-node'
  validations:
    - expression: >-
        'authentication.kubernetes.io/node-name' in request.userInfo.extra &&
        request.userInfo.extra['authentication.kubernetes.io/node-name'][0] == object.metadata.name
      message: the sbxr installer may change only the node it runs on
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sbxr-node-self
spec:
  policyName: sbxr-node-self
  validationActions: [Deny]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sbxr-node
  namespace: sbxr-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sbxr-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sbxr-node
    spec:
      serviceAccountName: sbxr-node
      hostPID: true
      # The installer reaches the API server without the pod network, which may depend on the containerd it restarts.
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      # The installer finishes its host changes after SIGTERM. This period covers a slow install: two 5-minute waits
      # (node runtime version, containerd serving sbxr), three containerd restarts (pending, new drop-in, rollback)
      # of up to 180 s each with systemd's default timeouts, plus API calls and lock waits. It is not a strict bound:
      # some units disable the start timeout and host commands have none. If the kubelet kills the installer anyway,
      # the next pod finishes the restart that was left pending.
      terminationGracePeriodSeconds: 1500
      containers:
        - name: sbxr-node
          image: "@IMAGE@"
          imagePullPolicy: IfNotPresent
          args: ["@MODE@"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          readinessProbe:
            exec:
              command: [test, -e, /tmp/done]
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - name: host
              mountPath: /host
      volumes:
        - name: host
          hostPath:
            path: /
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: sbxr
  annotations:
    sbxr.dev/limits: "container metrics only for the whole pod, shareProcessNamespace is ignored, no kubectl attach, in-place resize does not resize the VM, one VM per pod"
    sbxr.dev/docs: https://github.com/albertsko/sbxr/blob/main/docs/kubernetes.md
handler: sbxr
overhead:
  podFixed:
    memory: 64Mi
scheduling:
  nodeSelector:
    sbxr.dev/ready: "true"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sbxr-deny
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        # kubectl debug adds ephemeral containers through this subresource.
        resources: [pods, pods/ephemeralcontainers]
  matchConditions:
    - name: sbxr-runtime
      expression: has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'sbxr'
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: "!has(object.spec.hostNetwork) || !object.spec.hostNetwork"
      message: sbxr pods cannot use the host network
    - expression: "!has(object.spec.hostPID) || !object.spec.hostPID"
      message: sbxr pods cannot use the host PID namespace
    - expression: "!has(object.spec.hostIPC) || !object.spec.hostIPC"
      message: sbxr pods cannot use the host IPC namespace
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged)
      message: sbxr containers cannot be privileged
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) ||
        !has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0)
      message: sbxr containers cannot add capabilities
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sbxr-deny
spec:
  policyName: sbxr-deny
  validationActions: [Deny]
