# Opinionated golangci-lint config. Tested on golangci-lint v2.15.0.
# Strict on bugs, security, error handling, and idiomatic Go style.

version: "2"

run:
  build-tags: [vm, kube]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

linters:
  default: none
  enable:
    # Bugs and correctness.
    - bidichk
    - bodyclose
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - govet
    - ineffassign
    - loggercheck
    - makezero
    - nilerr
    - nilnesserr
    - noctx
    - nosprintfhostport
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - unused

    # Security.
    - gosec

    # Tests.
    - paralleltest
    - testableexamples
    - thelper
    - usetesting

    # Maintainability and idioms.
    - asciicheck
    - canonicalheader
    - dupl
    - dupword
    - errname
    - gocognit
    - goconst
    - godoclint
    - godot
    - gomoddirectives
    - goprintffuncname
    - iface
    - mirror
    - misspell
    - modernize
    - nakedret
    - nilnil
    - nolintlint
    - prealloc
    - protogetter
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
    - wsl_v5

  settings:
    depguard:
      rules:
        # core, kube-containerd, and kube-netlink share the core denies, so add a new core deny to each of the three.
        core:
          files:
            - "**/internal/**"
            - "!**/internal/cli/**"
            - "!**/internal/netstack/**"
            - "!**/internal/e2e/**"
            - "!**/internal/kube/shim/**"
            - "!**/internal/kube/agent/**"
            - "!**/internal/kube/podnet/**"
          deny:
            - pkg: github.com/spf13/cobra
              desc: only internal/cli may use the CLI framework
            - pkg: charm.land
              desc: only internal/cli may use charm libraries
            - pkg: github.com/charmbracelet
              desc: only internal/cli may use charm libraries
            - pkg: github.com/containers/gvisor-tap-vsock
              desc: only internal/netstack may use the network stack
            - pkg: gvisor.dev
              desc: only internal/netstack may use the network stack
            - pkg: k8s.io
              desc: no package uses the Kubernetes libraries
            - pkg: github.com/containerd
              desc: only internal/kube/shim and internal/kube/agent may use containerd APIs
            - pkg: github.com/vishvananda
              desc: only internal/kube/shim, internal/kube/agent, and internal/kube/podnet may use netlink
        kube-containerd:
          files:
            - "**/internal/kube/shim/**"
            - "**/internal/kube/agent/**"
          deny:
            - pkg: github.com/spf13/cobra
              desc: only internal/cli may use the CLI framework
            - pkg: charm.land
              desc: only internal/cli may use charm libraries
            - pkg: github.com/charmbracelet
              desc: only internal/cli may use charm libraries
            - pkg: github.com/containers/gvisor-tap-vsock
              desc: only internal/netstack may use the network stack
            - pkg: gvisor.dev
              desc: only internal/netstack may use the network stack
            - pkg: k8s.io
              desc: no package uses the Kubernetes libraries
        kube-netlink:
          files:
            - "**/internal/kube/podnet/**"
          deny:
            - pkg: github.com/spf13/cobra
              desc: only internal/cli may use the CLI framework
            - pkg: charm.land
              desc: only internal/cli may use charm libraries
            - pkg: github.com/charmbracelet
              desc: only internal/cli may use charm libraries
            - pkg: github.com/containers/gvisor-tap-vsock
              desc: only internal/netstack may use the network stack
            - pkg: gvisor.dev
              desc: only internal/netstack may use the network stack
            - pkg: k8s.io
              desc: no package uses the Kubernetes libraries
            - pkg: github.com/containerd
              desc: only internal/kube/shim and internal/kube/agent may use containerd APIs
        kube:
          files:
            - $all
            - "!**/cmd/sbxr-node/**"
            - "!**/cmd/sbxr-agent/**"
            - "!**/cmd/containerd-shim-sbxr-v1/**"
            - "!**/internal/kube/**"
          deny:
            - pkg: github.com/albertsko/sbxr/internal/kube
              desc: only internal/kube and the Kubernetes commands (cmd/sbxr-node, cmd/sbxr-agent, cmd/containerd-shim-sbxr-v1) may import the Kubernetes code
        product:
          files:
            - "**/cmd/**"
            - "!$test"
          deny:
            - pkg: github.com/albertsko/sbxr/internal/testenv
              desc: shipped binaries do not contain test helpers

    dupl:
      threshold: 200

    dupword:
      comments-only: true

    errcheck:
      check-type-assertions: true

    exhaustruct_v5:
      allow-empty: true
      ignore-patterns:
        - '.+/cobra\.Command'
        - 'charm\.land/log/v2\.Options'
        - 'archive/tar\.Header'
        - '.+/go-containerregistry/pkg/v1\.(Config|ConfigFile)'
        # Library types with many optional fields.
        - 'gvisor\.dev/gvisor/.+'
        - 'github\.com/containers/gvisor-tap-vsock/.+'
        - 'github\.com/miekg/dns\..+'
        - 'net/http\.(Server|Client|Transport)'
        # Generated protobuf messages, netlink requests, and syscall structs have many optional fields.
        - '.+/containerd/containerd/api/.+'
        - '.+/vishvananda/netlink\..+'
        - 'golang.org/x/sys/unix\..+'
        - '.+/opencontainers/runtime-spec/specs-go\..+'
        - 'syscall\.(SysProcAttr|Credential)'
      # Types whose fields are optional by design.
      optional-patterns:
        - '.+/internal/image\.Config'
        - '.+/internal/libkrun\.Config'
        - '.+/internal/runspec\.Error'

    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - commentedOutCode

    gosec:
      excludes:
        - G104 # Use errcheck as the primary unchecked-error checker.

    modernize:
      disable:
        - omitzero # golangci-lint v2.15.0 conflicts on alternative JSON-tag fixes.

    nolintlint:
      require-specific: true
      require-explanation: true

    revive:
      enable-default-rules: true
      rules:
        - name: datarace
        - name: defer
        - name: forbidden-call-in-wg-go

  exclusions:
    presets:
      - comments
      - common-false-positives
    rules:
      - path: _test\.go$
        linters:
          - dupl
          - goconst
          - errcheck
          - exhaustruct_v5
          - gocognit
          - gosec

formatters:
  enable:
    - goimports
    - gofumpt
