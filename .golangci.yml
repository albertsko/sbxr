# Opinionated golangci-lint config. Tested on golangci-lint v2.15.0.
# Strict on bugs, security, error handling, and idiomatic Go style.

version: "2"

run:
  build-tags: [vm, kube]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

linters:
  default: none
  enable:
    # Bugs and correctness.
    - bidichk
    - bodyclose
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - govet
    - ineffassign
    - loggercheck
    - makezero
    - nilerr
    - nilnesserr
    - noctx
    - nosprintfhostport
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - unused

    # Security.
    - gosec

    # Tests.
    - paralleltest
    - testableexamples
    - thelper
    - usetesting

    # Maintainability and idioms.
    - asciicheck
    - canonicalheader
    - dupl
    - dupword
    - errname
    - gocognit
    - goconst
    - godoclint
    - godot
    - gomoddirectives
    - goprintffuncname
    - iface
    - mirror
    - misspell
    - modernize
    - nakedret
    - nilnil
    - nolintlint
    - prealloc
    - protogetter
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
    - wsl_v5

  settings:
    depguard:
      # The "Dependency rules" section of AGENTS.md explains these rules.
      rules:
        cli-libs:
          files:
            - $all
            - "!**/internal/cli/**"
          deny:
            - pkg: github.com/spf13/cobra
              desc: only internal/cli parses flags and prints
            - pkg: charm.land
              desc: only internal/cli parses flags and prints
            - pkg: github.com/charmbracelet
              desc: only internal/cli parses flags and prints
        netstack-libs:
          files:
            - $all
            - "!**/internal/netstack/**"
          deny:
            - pkg: gvisor.dev
              desc: only internal/netstack may use the network stack
            - pkg: github.com/containers/gvisor-tap-vsock
              desc: only internal/netstack may use the network stack
            - pkg: github.com/miekg/dns
              desc: only internal/netstack may use the network stack
            - pkg: github.com/insomniacslk/dhcp
              desc: only internal/netstack may use the network stack
            - pkg: github.com/sirupsen/logrus
              desc: only internal/netstack may use the network stack, which logs through logrus
        containerd:
          files:
            - $all
            - "!**/internal/kube/{shim,agent}/**"
          deny:
            - pkg: github.com/containerd
              desc: only internal/kube/shim and internal/kube/agent may use containerd APIs
        netlink:
          files:
            - $all
            - "!**/internal/kube/{shim,agent,podnet}/**"
          deny:
            - pkg: github.com/vishvananda
              desc: only internal/kube/shim, internal/kube/agent, and internal/kube/podnet may use netlink
        k8s:
          files:
            - $all
          deny:
            - pkg: k8s.io
              desc: no package uses the Kubernetes libraries
        libkrun:
          files:
            - $all
            - "!**/internal/{libkrun,vm,preflight,kube/shim}/**"
          deny:
            - pkg: github.com/albertsko/sbxr/internal/libkrun
              desc: only internal/vm, internal/preflight, and internal/kube/shim may load libkrun
        krunconfig:
          files:
            - $all
            - "!**/internal/{krunconfig,run,runspec,guestmount}/**"
            - "!**/internal/libkrun/*_test.go"
          deny:
            - pkg: github.com/albertsko/sbxr/internal/krunconfig
              desc: only internal/run, internal/runspec, internal/guestmount, and the libkrun tests may write the guest config
        kube:
          files:
            - $all
            - "!**/internal/kube/**"
            - "!**/cmd/{sbxr-node,sbxr-agent,containerd-shim-sbxr-v1}/**"
          deny:
            - pkg: github.com/albertsko/sbxr/internal/kube
              desc: only internal/kube and the Kubernetes commands may import the Kubernetes code
        kube-layer:
          files:
            - "**/internal/kube/**"
          list-mode: lax
          allow:
            - github.com/albertsko/sbxr/internal/kube/
            - github.com/albertsko/sbxr/internal/libkrun$
          deny:
            - pkg: github.com/albertsko/sbxr/
              desc: internal/kube is a separate product and imports only internal/kube and internal/libkrun from this module
        libkrun-leaf:
          files:
            - "**/internal/libkrun/**"
            - "!$test"
          deny:
            - pkg: github.com/albertsko/sbxr/internal/
              desc: internal/libkrun is a leaf, so its non-test files import no other package of this module
        purego:
          files:
            - $all
            - "!**/internal/libkrun/**"
          deny:
            - pkg: github.com/ebitengine/purego
              desc: only internal/libkrun loads libraries with purego
        lower-layer:
          files:
            - "**/internal/{runspec,image,netstack,preflight,vm,guestmount,krunconfig,hv,userns,libkrun}/**"
          deny:
            - pkg: github.com/albertsko/sbxr/internal/cli
              desc: lower packages never import internal/cli or internal/run
            - pkg: github.com/albertsko/sbxr/internal/run$
              desc: lower packages never import internal/cli or internal/run
        test-helpers:
          files:
            - $all
            - "!$test"
          deny:
            - pkg: github.com/albertsko/sbxr/internal/testenv
              desc: only test files may use the test helpers

    dupl:
      threshold: 200

    dupword:
      comments-only: true

    errcheck:
      check-type-assertions: true

    exhaustruct_v5:
      allow-empty: true
      ignore-patterns:
        - '.+/cobra\.Command'
        - 'charm\.land/log/v2\.Options'
        - 'archive/tar\.Header'
        - '.+/go-containerregistry/pkg/v1\.(Config|ConfigFile)'
        # Library types with many optional fields.
        - 'gvisor\.dev/gvisor/.+'
        - 'github\.com/containers/gvisor-tap-vsock/.+'
        - 'github\.com/miekg/dns\..+'
        - 'net/http\.(Server|Client|Transport)'
        # Generated protobuf messages, netlink requests, and syscall structs have many optional fields.
        - '.+/containerd/containerd/api/.+'
        - '.+/vishvananda/netlink\..+'
        - 'golang.org/x/sys/unix\..+'
        - '.+/opencontainers/runtime-spec/specs-go\..+'
        - 'syscall\.(SysProcAttr|Credential)'
      # Types whose fields are optional by design.
      optional-patterns:
        - '.+/internal/image\.Config'
        - '.+/internal/libkrun\.Config'
        - '.+/internal/runspec\.Error'

    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - commentedOutCode

    gosec:
      excludes:
        - G104 # Use errcheck as the primary unchecked-error checker.

    modernize:
      disable:
        - omitzero # golangci-lint v2.15.0 conflicts on alternative JSON-tag fixes.

    nolintlint:
      require-specific: true
      require-explanation: true

    revive:
      enable-default-rules: true
      rules:
        - name: datarace
        - name: defer
        - name: forbidden-call-in-wg-go

  exclusions:
    presets:
      - comments
      - common-false-positives
    rules:
      - path: _test\.go$
        linters:
          - dupl
          - goconst
          - errcheck
          - exhaustruct_v5
          - gocognit
          - gosec

formatters:
  enable:
    - goimports
    - gofumpt
