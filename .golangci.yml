# Opinionated golangci-lint config. Tested on golangci-lint v2.15.0.
# Strict on bugs, security, error handling, and idiomatic Go style.

version: "2"

run:
  build-tags: [hv, kind]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

linters:
  default: none
  enable:
    # Bugs and correctness.
    - bidichk
    - bodyclose
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - govet
    - ineffassign
    - loggercheck
    - makezero
    - nilerr
    - nilnesserr
    - noctx
    - nosprintfhostport
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - unused

    # Security.
    - gosec

    # Tests.
    - paralleltest
    - testableexamples
    - thelper
    - usetesting

    # Maintainability and idioms.
    - asciicheck
    - canonicalheader
    - dupl
    - dupword
    - errname
    - gocognit
    - goconst
    - godoclint
    - godot
    - gomoddirectives
    - goprintffuncname
    - iface
    - mirror
    - misspell
    - modernize
    - nakedret
    - nilnil
    - nolintlint
    - prealloc
    - protogetter
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
    - wsl_v5

  settings:
    depguard:
      rules:
        core:
          files:
            - "**/internal/**"
            - "!**/internal/cli/**"
            - "!**/internal/netstack/**"
            - "!**/internal/scenario/**"
            - "!**/internal/vm/fake/**"
            - "!**/internal/shim/**"
            - "!**/internal/agent/**"
            - "!**/internal/podnet/**"
          deny:
            - pkg: github.com/spf13/cobra
              desc: only internal/cli may use the CLI framework
            - pkg: charm.land
              desc: only internal/cli may use charm libraries
            - pkg: github.com/charmbracelet
              desc: only internal/cli may use charm libraries
            - pkg: github.com/containers/gvisor-tap-vsock
              desc: only internal/netstack and internal/vm/fake may use the network stack
            - pkg: gvisor.dev
              desc: only internal/netstack and internal/vm/fake may use the network stack
            - pkg: k8s.io
              desc: the core has no Kubernetes code
            - pkg: github.com/containerd
              desc: only the Kubernetes adapters (internal/shim, internal/agent) may use containerd APIs
            - pkg: github.com/vishvananda
              desc: only the Kubernetes adapters (internal/podnet, internal/agent) may use netlink

    dupl:
      threshold: 200

    dupword:
      comments-only: true

    errcheck:
      check-type-assertions: true

    exhaustruct_v5:
      allow-empty: true
      ignore-patterns:
        - '.+/cobra\.Command'
        - 'charm\.land/log/v2\.Options'
        - 'archive/tar\.Header'
        - '.+/go-containerregistry/pkg/v1\.(Config|ConfigFile)'
        # Library types with many optional fields.
        - 'gvisor\.dev/gvisor/.+'
        - 'github\.com/containers/gvisor-tap-vsock/.+'
        - 'github\.com/miekg/dns\..+'
        - 'net/http\.(Server|Client|Transport)'
        # Generated protobuf messages, netlink requests, and syscall structs have many optional fields.
        - '.+/containerd/containerd/api/.+'
        - '.+/vishvananda/netlink\..+'
        - 'golang.org/x/sys/unix\..+'
        - '.+/opencontainers/runtime-spec/specs-go\..+'
        - 'syscall\.(SysProcAttr|Credential)'
      # Types whose fields are optional by design.
      optional-patterns:
        - '.+/internal/run\.ImageConfig'
        - '.+/internal/scenario\.(Scenario|Workload|Volume)'
        - '.+/internal/vm/libkrun\.Config'
        - '.+/internal/spec\.Error'

    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - commentedOutCode

    gosec:
      excludes:
        - G104 # Use errcheck as the primary unchecked-error checker.

    modernize:
      disable:
        - omitzero # golangci-lint v2.15.0 conflicts on alternative JSON-tag fixes.

    nolintlint:
      require-specific: true
      require-explanation: true

    revive:
      enable-default-rules: true
      rules:
        - name: datarace
        - name: defer
        - name: forbidden-call-in-wg-go

  exclusions:
    presets:
      - comments
      - common-false-positives
    rules:
      - path: _test\.go$
        linters:
          - dupl
          - goconst
          - errcheck
          - exhaustruct_v5
          - gocognit
          - gosec
      # Scenario tables repeat workload words such as echo.
      - path: internal/scenario/scenarios\.go$
        linters:
          - goconst

formatters:
  enable:
    - goimports
    - gofumpt
