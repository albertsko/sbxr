version: 2
project_name: sbxr
builds:
  - main: ./cmd/sbxr
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  - formats: [tar.gz]
checksum:
  name_template: checksums.txt
  # sbxr-install.yaml and sbxr-uninstall.yaml from the release workflow's node-manifests job.
  extra_files:
    - glob: ./node-manifests/*.yaml
changelog:
  use: github
  format: "{{ .Message }}{{ if .Logins }} ({{ .Logins | englishJoin }}){{ end }}"
  filters:
    exclude:
      - "^Merge "
  groups:
    - title: Breaking changes
      regexp: '^\w+(\([^)]*\))?!:'
      order: -1
    - title: Features
      regexp: '^feat(\([^)]*\))?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\([^)]*\))?:'
      order: 1
    - title: Other changes
      order: 999
release:
  prerelease: auto
  extra_files:
    - glob: ./node-manifests/*.yaml
  header: |
    {{ .TagSubject }}
    {{- with .TagBody }}

    {{ . }}
    {{- end }}
